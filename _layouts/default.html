<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title }} — VibeDrive</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #5c5c5c;
      --accent: #0a58ca;
      --border: #e5e5e5;
      --bg-soft: #f7f7f8;
    }
    * { box-sizing: border-box; }
    body {
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--fg);
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
      background: #fff;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav.site-nav {
      font-size: .92rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: baseline;
    }
    nav.site-nav .brand {
      font-weight: 600;
      color: var(--fg);
      font-size: 1rem;
    }
    h1 { font-size: 1.85rem; line-height: 1.25; margin-top: 0; }
    h2 { font-size: 1.25rem; margin-top: 2.5rem; line-height: 1.3; }
    h3 { font-size: 1.05rem; margin-top: 1.75rem; line-height: 1.35; }
    p, ul, ol { margin: .9rem 0; }
    ul, ol { padding-left: 1.4rem; }
    li { margin: .25rem 0; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.25rem 0;
      font-size: .94rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: .55rem .75rem;
      text-align: left;
      vertical-align: top;
    }
    th { background: var(--bg-soft); font-weight: 600; }
    blockquote {
      border-left: 3px solid #c9c9c9;
      margin: 1.25rem 0;
      padding: .25rem 1rem;
      color: var(--muted);
      background: var(--bg-soft);
      border-radius: 0 4px 4px 0;
    }
    blockquote > p:first-child { margin-top: .25rem; }
    blockquote > p:last-child { margin-bottom: .25rem; }
    code {
      background: var(--bg-soft);
      padding: .1rem .35rem;
      border-radius: 3px;
      font-size: .92em;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
    footer {
      margin-top: 4rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: .88rem;
      color: var(--muted);
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="/" class="brand">VibeDrive</a>
    <a href="/privacy/">Privacy</a>
    <a href="/terms/">Terms</a>
    <a href="/account-deletion/">Account deletion</a>
    <a href="mailto:contact@vibedrive.app">Contact</a>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    &copy; {{ "now" | date: "%Y" }} VibeDrive ·
    <a href="mailto:contact@vibedrive.app">contact@vibedrive.app</a>
  </footer>
</body>
</html>
